<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y-Shop | Boutique de Maillots</title>
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/api.js"></script>
    <script defer src="./js/app.js"></script>
</head>
<body>
    <header>
        <img src="./assets/img/logo/logo.png" alt="Logo Y-Shop" id="logo-site">

        <h1>Boutique Officielle</h1>

        <nav>
            <ul>
                <li><a href="index.html">Catalogue</a></li>
                <li><a href="favoris.html">Favoris (<span id="compteur-favoris">0</span>)</a></li>
                <li><a href="panier.html">Panier (<span id="compteur-panier">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="accueil">
            <h2>Les maillots de la Coupe du Monde</h2>
            <p>Retrouve les maillots des plus grandes nations pour soutenir ton équipe préférée.</p>

            <div class="hero-carousel">
                <div class="carousel-track" id="carousel-accueil"></div>
            </div>
        </section>

        <section id="filtres">
            <h2>Nos Maillots</h2>

            <div class="zone-filtres">
                <input type="search" id="recherche" placeholder="Rechercher un maillot">

                <select id="filtre-marque">
                    <option value="">Toutes les marques</option>
                </select>

                <select id="filtre-couleur">
                    <option value="">Toutes les couleurs</option>
                </select>

                <select id="tri">
                    <option value="nom">Nom A-Z</option>
                    <option value="prix-croissant">Prix croissant</option>
                    <option value="prix-decroissant">Prix décroissant</option>
                    <option value="stock">Stock disponible</option>
                </select>
            </div>
        </section>

        <section id="catalogue" class="grille-produits">
            <p>Chargement des maillots en cours...</p>
        </section>
    </main>
</body>
</html>
