<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue</title>
    <link rel="stylesheet" href="./css/style.css">
    
    <script defer src="./js/app.js"></script>
</head>
<body>
    <header>
        <a href="index.html">
            <img src="./assets/img/logo/logo.png" alt="Logo Y-Shop" id="logo-site">
        </a>
        <h1>New Jersey</h1>
        <nav>
            <ul>
                <li><a href="index.html">Catalogue</a></li>
                <li><a href="favoris.html">Favoris</a></li>
                <li><a href="panier.html">Panier</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Les maillots de la Coupe du Monde</h2>
            <p>Retrouve les maillots des plus grandes nations pour soutenir ton équipe préférée.</p>
        </section>

        <section id="filtres">
            <input type="text" id="recherche" placeholder="Rechercher un maillot">
            <select id="filtre-marque">
                <option value="">Toutes les marques</option>
            </select>
            <select id="filtre-couleur">
                <option value="">Toutes les couleurs</option>
            </select>
            <select id="tri-nom">
                <option value="asc">Nom A-Z</option>
            </select>
        </section>

        <div id="grille-accueil" class="grille-produits">
            <p>Chargement du catalogue...</p>
        </div>
    </main>
</body>
</html>
