<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y-Shop | Détail Produit</title>
    <link rel="stylesheet" href="./css/style.css">
    
    <script defer src="./js/app.js"></script>
    <script defer src="./js/produit.js"></script>
</head>
<body>
    <header>
        <img src="./assets/img/logo/logo.png" alt="Logo Y-Shop" id="logo-site">
        <h1>Boutique Officielle</h1>
        <nav>
            <ul>
                <li><a href="index.html">Catalogue</a></li>
                <li><a href="favoris.html">Favoris (<span id="compteur-favoris">0</span>)</a></li>
                <li><a href="panier.html">Panier (<span id="compteur-panier">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="detail-produit">
            <div class="detail-container">
                <div class="detail-image">
                    <img id="img-produit" src="" alt="">
                </div>
    
                <div class="detail-info">
                    <h2 id="nom-produit">Chargement du maillot...</h2>
                    <p id="prix-produit" class="prix"></p>
                    
                    <h4>Description :</h4>
                    <p id="desc-produit" class="description"></p>
                    
                    <p id="stock-produit"></p>
    
                    <button id="btn-panier" class="btn-ajout">
                        Ajouter au panier
                    </button>
                </div>
            </div>
        </section>

        
    </main>
</body>
</html>
